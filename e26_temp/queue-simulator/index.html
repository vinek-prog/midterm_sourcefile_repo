
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Queue Data Structure Simulator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://code.jquery.com/jquery-3.6.3.min.js"></script>

    <script src="queue.js"></script>

    <link href="style.css" rel="stylesheet">
</head>


<body>
    <div class="container col-sm-6">

        <div class="row">
            <h1 class="display-7 p-3 mb-1 text-center text-bg-dark">
                Queue Data Structure Simulator
            </h1>
        </div>

        <div class="row text-bg-success p-3 mb-1">
            <div class="col text-center fs-4">Operations</div>
            <div class="col text-center fs-4">Queue Data</div>
            <div class="col text-center fs-4">Deleted from Queue</div>
        </div>

        <div class="row bg-danger">

            <div class="col bg-7B8FA1">
                <div class="d-grid gap-1 col mx-auto">

                    <input type="text" id="input"
                        class="form-control text-center mt-2"
                        placeholder="data">

                    <button id="enqueue" class="btn btn-success">
                        Enqueue
                    </button>

                    <button id="dequeue" class="btn btn-danger">
                        Dequeue
                    </button>

                    <button id="peek" class="btn btn-warning">
                        Peek
                    </button>

                    <button id="clear" class="btn btn-light">
                        Clear
                    </button>

                </div>
            </div>

<div class="col bg-dark queue-column">

    <div class="queue-label">
        FRONT
    </div>

    <div id="queue"></div>

    <div class="queue-label">
        REAR
    </div>

    
</div>

            <div id="deleted" class="col popped bg-9C254D">
            </div>

        </div>
    </div>
</body>
</html>
